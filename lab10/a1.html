<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=parseInt(prompt("enter a num a  "));
        let b=parseInt(prompt("enter a num b"));

function add(a, b)
{ 
    return a + b;
 }


let multipliction = (x, y) => x * y;


let square = n => n * n;


let greet = () => alert("hello good morning!");

document.write("Add: " + add(a,b) + "<br>");
document.write("multipliction: " + multipliction(a,b) + "<br>");
document.write("Square: " + square(a) + "<br>");
greet();
</script>

</body>
</html>
