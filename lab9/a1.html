<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 20;
        let b = 30;
        document.write("Max is " + Math.max(a, b) + "<br>");
        document.write("Min is " + Math.min(a, b) + "<br>");

        let c = -87;
        document.write("Absolute is " + Math.abs(c));
    </script>
</body>
</html>
