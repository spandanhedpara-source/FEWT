<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Digit Password</title>
</head>
<body>
    <script>
       
        let length = parseInt(prompt("Enter password length "));

        let password = "";

        for (let i = 0; i < length; i++) {
            
            let digit = Math.floor(Math.random() * 10);
            password += digit;
        }

        document.write("Generated Password: " + password);
    </script>
</body>
</html>
