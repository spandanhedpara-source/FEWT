<body>
    <script>
        let a = parseInt(prompt("Enter a of range:"));
        let b = parseInt(prompt("Enter end of range:"));


        
            for (let n = a; n <= b; n++) {
                let prime = true;
                if (n < 2) {
                    prime = false;}

                for (let i = 2; i < n; i++) {
                    if (n % i == 0) 
                    { prime = false;
                         break; }
                }
                if (prime) 
                document.write(n + "<br>");
            }
        
    </script>
</body>
