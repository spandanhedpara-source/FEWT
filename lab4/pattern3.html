<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     let n = parseInt(prompt("Enter number of rows"));
let flag=0;
        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= i; j++) {
              
                if ((flag) % 2 == 0) {
                    document.write("1 ");
                } else {
                    document.write("0 ");
                }
                flag++;
            }
            document.write("<br/>");
        }
    </script>
</body>
</html>
