<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     
    let num = parseInt(prompt("Enter a 2-digit number:"));

    
    let firstDigit = Math.floor(num / 10);   
    let secondDigit = num % 10;              

    
    let result = 1;
    for (let i = 1; i <= secondDigit; i++) {
      result *= firstDigit;
    }

    alert("First digit: " + firstDigit +
          "\nSecond digit: " + secondDigit +
          "\nResult: " + result);
    </script>
</body>
</html>
