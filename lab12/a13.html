<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <p class="click-hide">Click me and I'll disappear.</p>
<button class="click-hide">Click me too</button>

<script>
  $('.click-hide').click(function() {
    $(this).hide();
  });
</script>
</body>
</html>
