<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <input type="text" id="txt">
<button id="set">Set Text</button>
<p class="data"></p>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$("#set").click(function(){
  let val = $("#txt").val();
  $(".data").text(val);
});
</script>

</body>
</html>
