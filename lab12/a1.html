<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fade Example</title>
</head>
<body>
    
    <div id="box" style="background:blue;height:200px;width:200px;"></div>
   
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    $("#box").click(function(){
      $(this).fadeOut();
    });
    </script>
</body>
</html>
