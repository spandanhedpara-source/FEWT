<!DOCTYPE html>
<html>
<body>
<script>
  let n = parseInt(prompt("Enter size of array:"));
  let arr = [];
  for (let i = 0; i < n; i++) {
    arr[i] = parseInt(prompt("Enter element " + (i+1) + ":"));
  }

  let max = arr[0];
  for (let i = 1; i < n; i++) {
    if (arr[i] > max) {
      max = arr[i];
    }
  }

  document.write("Maximum number is: " + max);
</script>
</body>
</html>
