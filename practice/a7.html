<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>
<form onsubmit="return validateForm()">
    Username: <input type="text" id="username"><br><br>
    Password: <input type="password" id="password"><br><br>
    Repeat Password: <input type="password" id="repeat"><br><br>
    Date of Birth: <input type="date" id="dob"><br><br>
    Enrollment No: <input type="text" id="enroll"><br><br>
    Email: <input type="text" id="email"><br><br>
    <input type="submit" value="Submit">
</form>

<script>
function validateForm() {
    let uname = document.getElementById("username").value;
    let pass = document.getElementById("password").value;
    let repass = document.getElementById("repeat").value;
    let dob = document.getElementById("dob").value;
    let enroll = document.getElementById("enroll").value;
    let email = document.getElementById("email").value;

    // 1) Username check
    if(uname.length < 8){
        alert("Username must be at least 8 characters");
        return false;
    }

    // 2) Password check
    let passPattern = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,12}$/;
    if(!passPattern.test(pass)){
        alert("Password must be 8-12 chars, include 1 digit & 1 special char");
        return false;
    }

    // 3) Repeat password check
    if(pass !== repass){
        alert("Passwords do not match");
        return false;
    }

    // 4) Age check from DOB
    let birthDate = new Date(dob);
    let today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    let m = today.getMonth() - birthDate.getMonth();
    if(m < 0 || (m === 0 && today.getDate() < birthDate.getDate())){
        age--;
    }
    if(age <= 18){
        alert("Age must be greater than 18");
        return false;
    }

    // 5) Enrollment check
    if(!/^\d{11}$/.test(enroll)){
        alert("Enrollment must be exactly 11 digits");
        return false;
    }

    // 6) Email validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailPattern.test(email)){
        alert("Invalid email format");
        return false;
    }

    alert("All validations passed!");
    return true;
}
</script>
</body>
</html>
