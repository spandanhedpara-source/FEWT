<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Program</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Enter a number to find factorial"));

        let ans = 1;
        for (let i = 1; i <= a; i++) {
            ans = ans * i;
        }

        alert("Factorial of " + a + " is = " + ans);
    </script>
</body>
</html>
