<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n1 = parseInt(prompt("Enter a num"));
        let n2 = parseInt(prompt("Enter a num"));

        let ans;
        let operation = prompt("Enter any operation +,*,/,-")
        if (operation == '+') {
            alert("ans is " + (n1 + n2))

        }
        else if (operation == '-') {
            alert("ans is " + (n1 - n2))

        }
        else if (operation == '/') {
            if (n2 != 0) {
                alert("ans is " + (n1 / n2))
            }
            else {
                alert("invalid operation")
            }


        }
        else if (operation == '*') {
            alert("ans is " + (n1 * n2))

        }
        else {
            alert("invalid operation")
        }


    </script>
</body>

</html>
