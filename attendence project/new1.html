<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Attendance Tracker</title>
    <style>
        /* --- 1. CSS STYLING --- */
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --text: #1e293b;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            border-bottom: 3px solid #e2e8f0;
            padding-bottom: 10px;
        }

        input,
        button {
            padding: 12px;
            margin: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            color: white;
            border: none;
            font-weight: bold;
        }

        .btn-blue {
            background: var(--primary);
        }

        .btn-green {
            background: var(--success);
        }

        .btn-red {
            background: var(--danger);
        }

        /* Table Styling */
        .table-container {
            max-height: 50vh;
            overflow-y: auto;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #1e293b;
            color: white;
            position: sticky;
            top: 0;
        }

        /* Interactive Elements */
        .active-row {
            border: 2px solid var(--primary);
            background: #e0f2fe;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        /* Summary Popup */
        #summaryModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ATTENDANCE TRACKER</h1>

        <!-- --- 2. SETUP SCREEN --- -->
        <div id="setup" style="text-align: center;">
            <p>Enter Roll Number Range (e.g., 101 to 466)</p>
            <input type="number" id="start" placeholder="Start Roll">
            <input type="number" id="end" placeholder="End Roll">
            <button class="btn-blue" onclick="startSession()">Start Session</button>
        </div>

        <!-- --- 3. MAIN INTERFACE --- -->
        <div id="main" class="hidden">
            <div style="text-align: center; margin-bottom: 10px;">
                <button class="btn-green" onclick="markAll('Present')">All Present</button>
                <button class="btn-red" onclick="markAll('Absent')">All Absent</button>
                <button class="btn-blue" onclick="showSummary()">Show Summary</button>
                <p><i>⌨️ Left Arrow = Present | Right Arrow = Absent</i></p>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Roll</th>
                            <th>Name</th>
                            <th>Action</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <p style="text-align: right; font-weight: bold; color: gray; margin-top: 20px;">- SPANDAN HEDPARA</p>
    </div>

    <!-- --- 4. SUMMARY POPUP --- -->
    <div id="summaryModal" class="hidden">
        <div class="modal-content">
            <h2 style="margin-top:0;">Attendance Summary</h2>
            <div id="summaryText"></div>
            <button class="btn-blue" style="width: 100%; margin-top: 15px;"
                onclick="document.getElementById('summaryModal').classList.add('hidden')">Close</button>
        </div>
    </div>

        let activeStudents = [];
        let currentIndex = 0;

        // --- 6. CORE LOGIC ---

        function startSession() {
            let start = parseInt(document.getElementById('start').value);
            let end = parseInt(document.getElementById('end').value);

            // Filter out only the requested students, and attach a blank 'status' property to them
            activeStudents = allStudents
                .filter(s => s.rol >= start && s.rol <= end)
                .map(s => ({ ...s, status: null }));

            if (activeStudents.length === 0) return alert("No students found in range.");

            // Hide Setup, Show Main
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');

            renderTable();
            speak("Session Started");
        }

        // Re-draws the entire table when a change is made
        function renderTable() {
            const tbody = document.getElementById("tbody");

            // Loop through students to create table rows
            tbody.innerHTML = activeStudents.map((s, index) => {

                // Determine styling based on status
                let statusBadge = '';
                if (s.status === 'Present') statusBadge = '<span class="status-badge btn-green">Present</span>';
                if (s.status === 'Absent') statusBadge = '<span class="status-badge btn-red">Absent</span>';

                // Check if this is the active row being edited
                let isActive = (index === currentIndex) ? 'active-row' : '';

                return `
                <tr id="row${index}" class="${isActive}">
                    <td><strong>${s.rol}</strong></td>
                    <td>${s.name}</td>
                    <td>
                        <button class="btn-green" onclick="mark(${index}, 'Present')">P</button>
                        <button class="btn-red" onclick="mark(${index}, 'Absent')">A</button>
                    </td>
                    <td>${statusBadge}</td>
                </tr>`;
            }).join("");

            // Keep the highlighted row in view
            if (document.getElementById(`row${currentIndex}`)) {
                document.getElementById(`row${currentIndex}`).scrollIntoView({ behavior: "smooth", block: "center" });
            }
        }

        // A single function handles BOTH present and absent assignments
        function mark(index, status) {
            activeStudents[index].status = status; // Save status directly into the array
            speak(`${activeStudents[index].rol} ${status}`); // Speak out loud

            currentIndex = index + 1; // Move down one row
            renderTable(); // Update the screen
        }

        // Quickly marks everyone at once
        function markAll(status) {
            let originalSpeak = window.speak;
            window.speak = () => { }; // Temporarily mute to stop it saying 60 names out loud

            activeStudents.forEach((s, index) => mark(index, status)); // Apply to all

            window.speak = originalSpeak; // Unmute
            speak("All marked " + status);
        }

        function showSummary() {
            // Find who is absent/present directly from the main array
            const absents = activeStudents.filter(s => s.status === 'Absent');
            const presents = activeStudents.filter(s => s.status === 'Present');

            let html = `<h3>Total Absent: <span style="color:red">${absents.length}</span> | Total Present: <span style="color:green">${presents.length}</span></h3>`;

            if (absents.length > 0) {
                html += `<ul style="text-align: left">` + absents.map(s => `<li><strong>${s.rol}</strong> - ${s.name}</li>`).join("") + `</ul>`;
            } else {
                html += `<p>Everyone is present!</p>`;
            }

            document.getElementById('summaryText').innerHTML = html;
            document.getElementById('summaryModal').classList.remove('hidden');
            speak("Showing summary");
        }

        // --- 7. HARDWARE INTEGRATION ---

        // Voice Engine
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(text);
                msg.rate = 1.3;
                window.speechSynthesis.speak(msg);
            }
        }

        // Keyboard Navigation (Arrow Keys)
        document.addEventListener('keydown', (event) => {
            if (activeStudents.length === 0 || currentIndex >= activeStudents.length) return;

            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                mark(currentIndex, 'Present');
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                mark(currentIndex, 'Absent');
            }
        });
    </script>
