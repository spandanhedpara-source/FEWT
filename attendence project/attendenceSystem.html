<!DOCTYPE html>
<html lang="en">
<head>
    <title>Class Attendance</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; }
        button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .present { background: #dcfce7; color: #166534; }
        .absent { background: #fee2e2; color: #991b1b; }
        button:hover { opacity: 0.8; }
        ul { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        li { padding: 10px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="container">
    <h3>Attendance (Up to 165)</h3>
    <div class="input-group">
        <input type="number" id="rollInput" placeholder="Enter Roll No (101-165)">
        <button class="present" onclick="mark('Present')">P</button>
        <button class="absent" onclick="mark('Absent')">A</button>
    </div>
    <ul id="list"></ul>
</div>

</script>
</body>
</html>
