                .setup-container {

                    padding: 40px;
                    border-radius: 16px;

                    border: 2px solid #e2e8f0;
                    margin-bottom: 20px;
                    width: 100%;

                }
                .setup-container input:focus { border-color: #3b82f6; }

                /* Scrollable List */
                .list {
                    margin-top: 20px;
                    overflow-y: auto;
                    overflow-x: hidden;
                    height: 55vh; 
                    border-radius: 12px;
                    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
                    background: white;
                    border: 2px solid #e2e8f0;
                }

                .about {
                    text-align: right;
                    margin-top: 20px;
                    margin-right: 30px;
                    font-weight: 700;
                    color: #475569;
                    letter-spacing: 1px;
                    padding-bottom: 20px;
                }
                
                /* Keyboard Navigation Highlight */
                .active-row {
                    border: 3px solid #3b82f6 !important; 
                    transform: scale(1.01);
                    transition: all 0.2s ease-in-out;
                    box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
                    z-index: 2;
                    position: relative;
                }

                .btn { border-radius: 8px; border-width: 2px; }
                .hidden { display: none !important; }

                @media only screen and (max-width: 500px) {
                    .title { font-size: 26px; }
                }

                // Active Session Variables
                let Student = [];
                let prestu = [];
                let absstu = [];
                let currentIndex = 0; 

                // --- SETUP PHASE ---
                function startSession() {
                    let start = parseInt(document.getElementById('startRoll').value);
                    let end = parseInt(document.getElementById('endRoll').value);

                    // Filter the full database based on user input
                    Student = allStudents.filter(s => s.rol >= start && s.rol <= end);

                    if (Student.length === 0) {
                        alert("No students found in that range. Ensure you typed the numbers correctly.");
                        return;
                    }

                    // Hide Setup, Show Main Screen
                    document.getElementById('setupScreen').classList.add('hidden');
                    document.getElementById('mainScreen').classList.remove('hidden');
                    document.getElementById('rangeDisplay').innerText = `STUDENT LIST (${start} - ${end})`;

                    // Generate Table
                    generateTable();
                    
                    // Wake up speech engine
                    speak("Session Started.");
                }

                function generateTable() {
                    let htmlList = document.getElementById("tbody");
                    htmlList.innerHTML = ""; // Clear just in case
                    
                    for (let i = 0; i < Student.length; i++) {
                        htmlList.innerHTML += `
                        <tr class="alert alert-light border" role="alert" align="center" id="row${i}">
                            <td class="fw-bold fs-5">${Student[i].rol}</td>
                            <td class="fw-500">${Student[i].name}</td>
                            <td>
                                <button class="btn btn-outline-success btn-sm me-2 px-3 fw-bold" onclick="present(${i})" id="prebtn${i}">Present</button>
                                <button class="btn btn-outline-danger btn-sm px-3 fw-bold" onclick="absent(${i})" id="abbtn${i}">Absent</button>
                            </td>
                        </tr>
                        `;
                    }
                    updateHighlight();
                }
                
                // --- KEYBOARD & HIGHLIGHT SYSTEM ---
                function updateHighlight() {
                    document.querySelectorAll('tr').forEach(row => row.classList.remove('active-row'));
                    
                    let currentRow = document.getElementById(`row${currentIndex}`);
                    if (currentRow) {
                        currentRow.classList.add('active-row');
                        currentRow.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }

                document.addEventListener('keydown', (event) => {
                    // Only trigger if we are on the main screen and haven't finished the list
                    if (Student.length === 0 || currentIndex >= Student.length) return; 

                    if (event.key === 'ArrowLeft') {
                        event.preventDefault(); 
                        present(currentIndex);
                    } else if (event.key === 'ArrowRight') {
                        event.preventDefault();
                        absent(currentIndex);
                    }
                });
                
                // --- TEXT TO SPEECH SYSTEM ---
                function speak(text) {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel(); 
                        let msg = new SpeechSynthesisUtterance(text);
                        msg.rate = 1.3; 
                        window.speechSynthesis.speak(msg);
                    }
                }

                // --- ATTENDANCE LOGIC ---
                function present(i) {
                    let btnpre = document.getElementById(`prebtn${i}`);
                    let btnabs = document.getElementById(`abbtn${i}`);
                    let row = document.getElementById(`row${i}`);

                    btnpre.classList.replace('btn-outline-success', 'btn-success');
                    btnabs.classList.replace('btn-danger', 'btn-outline-danger');
                    row.className = "alert alert-success border";

                    let found = false;
                    for (let j = 0; j < prestu.length; j++) {
                        if (prestu[j].rol == Student[i].rol) { found = true; break; }
                    }
                    if (found == false) { prestu.push(Student[i]); }

                    for (let k = 0; k < absstu.length; k++) {
                        if (absstu[k].rol == Student[i].rol) { absstu.splice(k, 1); break; }
                    }
                    
                    speak(Student[i].rol + " Present");

                    currentIndex = i + 1;
                    updateHighlight();
                }

                function absent(i) {
                    let btnabs = document.getElementById(`abbtn${i}`);
                    let btnpre = document.getElementById(`prebtn${i}`);
                    let row = document.getElementById(`row${i}`);

                    btnabs.classList.replace('btn-outline-danger', 'btn-danger');
                    btnpre.classList.replace('btn-success', 'btn-outline-success');
                    row.className = "alert alert-danger border";

                    let found = false;
                    for (let j = 0; j < absstu.length; j++) {
                        if (absstu[j].rol == Student[i].rol) { found = true; break; }
                    }
                    if (found == false) { absstu.push(Student[i]); }

                    for (let k = 0; k < prestu.length; k++) {
                        if (prestu[k].rol == Student[i].rol) { prestu.splice(k, 1); }
                    }
                    
                    speak(Student[i].rol + " Absent");

                    currentIndex = i + 1;
                    updateHighlight();
                }

                function allpre() {
                    speak("Marking all present");
                    for (let i = 0; i < Student.length; i++) {
                        let tempSpeak = window.speak; 
                        window.speak = function(){}; 
                        present(i);
                        window.speak = tempSpeak;
                    }
                }

                function allabs() {
                    speak("Marking all absent");
                    for (let i = 0; i < Student.length; i++) {
                        let tempSpeak = window.speak; 
                        window.speak = function(){}; 
                        absent(i);
                        window.speak = tempSpeak;
                    }
                }

                function tkatd() {
                    speak("Showing summary");
                    let display = document.getElementById(`summary`);
                    let dt = new Date();
                    prestu.sort((a, b) => a.rol - b.rol);
                    absstu.sort((a, b) => a.rol - b.rol);

                    let html = `
                        <div class="mb-3 text-muted fw-bold">${dt.toLocaleString()}</div>
                        <h5 class="text-danger fw-bold fs-4">Absent Students</h5>
                        <div class="table-responsive bg-white rounded shadow-sm border">
                            <table class="table table-striped mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Roll no.</th>
                                        <th>Name</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    if (absstu.length === 0) {
                        html += `<tr><td colspan="2" class="text-center py-3">No students are absent.</td></tr>`;
                    } else {
                        for (let i = 0; i < absstu.length; i++) {
                            html += `
                                <tr>
                                    <td class="fw-bold">${absstu[i].rol}</td>
                                    <td>${absstu[i].name}</td>
                                </tr>
                            `;
                        }
                    }

                    html += `
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-4 p-4 bg-white rounded shadow-sm border border-secondary">
                            <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                                <span class="text-danger fw-bold fs-5">Total Absent:</span>
                                <span class="badge bg-danger fs-5 px-3 rounded-pill">${absstu.length}</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-success fw-bold fs-5">Total Present:</span>
                                <span class="badge bg-success fs-5 px-3 rounded-pill">${prestu.length}</span>
                            </div>
                        </div>
                    `;

                    display.innerHTML = html;
                }
            </script>
