<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <style>
        /* --- AESTHETIC CSS --- */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f1f5f9;
            color: #334155;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #0f172a;
        }

        /* Scrollable List */
        ul {
            list-style: none;
            padding: 0;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        /* Hide scrollbar for a cleaner look */
        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }

        li {
            padding: 12px 15px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        li:last-child { border-bottom: none; }

        /* Row states */
        .row-present { background: #dcfce7; }
        .row-absent { background: #fee2e2; }

        .student-info { font-weight: 500; }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-p { background: #22c55e; color: white; }
        .btn-a { background: #ef4444; color: white; }
        .btn-p:hover { background: #16a34a; }
        .btn-a:hover { background: #dc2626; }

        /* Final Action Section */
        .footer-actions {
            margin-top: 20px;
            text-align: center;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        .btn-finish {
            background: #6366f1;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            width: 100%;
        }
        .btn-finish:hover { background: #4f46e5; }

        .summary-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: none;
        }

        .summary-box span { font-weight: bold; color: #ef4444; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>Daily Roll Call</h2>
    
    <ul id="studentList">
        <!-- List gets generated by JavaScript -->
    </ul>

    <div class="footer-actions">
        <button class="btn-finish" onclick="showAbsent()">Complete Attendance & Show Absent</button>
        <div class="summary-box" id="summaryBox">
            <p><strong>Absent Roll Numbers:</strong></p>
            <span id="absentList">None</span>
        </div>
    </div>
</div>

<script>
    // Full database of students from Roll 101 to 165
    const students = {
        101: "Chitre Jeet Mehulbhai", 102: "Tanvi Mehta", 103: "Trivedi Harsh Umangkumar",
        104: "Vrajrajsinh Gohil", 105: "Bhojani Dev Ankitbhai", 106: "Jani Shreya Vimal",
        107: "Chauhan Krushna Sanjaybhai", 108: "Palsana Henish Sureshbhai", 109: "Thanki Aum Punitbhai",
        110: "Dattani Pratham Chetan", 111: "Dholariya Marth Vinodbhai", 112: "Dhruv Dave",
        113: "Boricha Niyanta Sanjaybhai", 114: "Rupareliya Manav Vikasbhai", 115: "Godhasara Peryben Rajeshbhai",
        116: "Veer Turakhia", 117: "Kanzariya Utsav Bhagvanjibhai", 118: "Kesha Satishbhai Kaneriya",
        119: "Maheta Kashish Sukeshbhai", 120: "Khagram Kruti Nileshbhai", 121: "Nandani Pareshkumar Rana",
        122: "Limbasiya Harsh Hiteshbhai", 123: "Sarvaiya Aishwarya Harshadbhai", 124: "Rachhadiya Garv Bharatbhai",
        125: "Dhabaliya Dhairya Amitkumar", 126: "Pambhar Nirdip Bhailalbhai", 127: "Zaveri Raxit Pareshbhai",
        128: "Sureliya Ruchita Pankajbhai", 129: "Kathrani Rinal Dineshbhai", 130: "Madhwani Rutvi Hareshkumar",
        131: "Sudani Meet Shaileshbhai", 132: "Varsani Disha Govindbhai", 133: "Prajapati Hetaviben Ganpatbhai",
        134: "Pandya Aum Bhaveshbhai", 135: "Kataria Lipsit Bhavesh", 136: "Makwana Dhairya Mayur",
        137: "Rangani Harsh Amitbhai", 138: "Dobariya Jenil Shantibhai", 139: "Kothari Uttam Maheshbhai",
        140: "Naliyapara Mahek Bhaveshbhai", 141: "Virani Pujan Hiteshbhai", 142: "Deshani Harshil Chandubhai",
        143: "Rathod Madhav Rohanbhai", 144: "Rabadiya Lency Pankajbhai", 145: "Dholu Dharmik Ghanshyambhai",
        146: "Godhani Vishva Kamleshbhai", 147: "Ghetiya Khushkumar Niteshbhai", 148: "Javia Diya Mehul",
        149: "Bhanderi Krisha Jitendra", 150: "Bosamiya Shriya Jitendrabhai", 151: "Zinzuvadiya Urvashi Bharatbhai",
        152: "Sonagara Abhishek Kishorbhai", 153: "Patadia Hetvi Chetan", 154: "Banugariya Pushti Vimalbhai",
        155: "Moral Satvi Ashish", 156: "Sodha Dhara Ashokbhai", 157: "Dholu Bansiben Kanubhai",
        158: "Dhyani Hemant Patel", 159: "Detroja Velishkumar Dineshbhai", 160: "Avlani Neel Naimishbhai",
        161: "Hedpara Spandan Pankajbhai", 162: "Rathod Jill Devendrabhai", 163: "Metaliya Jeelkumar Bhaveshbhai",
        164: "Parmar Khushali Makanbhai", 165: "Jarsaniya Vatsal Pradipbhai"
    };

    // Keep track of who is marked what
    let attendanceData = {}; 

    // 1. Generate the list when the page loads
    window.onload = function() {
        const listEl = document.getElementById("studentList");
        
        for (let roll in students) {
            let li = document.createElement("li");
            li.id = "row-" + roll; // Give row an ID so we can color it later
            
            li.innerHTML = `
                <div class="student-info">${roll} - ${students[roll]}</div>
                <div class="btn-group">
                    <button class="btn-p" onclick="mark('${roll}', 'Present')">Present</button>
                    <button class="btn-a" onclick="mark('${roll}', 'Absent')">Absent</button>
                </div>
            `;
            listEl.appendChild(li);
        }
    };

    // 2. Text-to-Speech functionality
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop any currently playing speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.1; // Slightly faster speaking rate
            window.speechSynthesis.speak(utterance);
        }
    }

    // 3. Mark a student and visually update the row
    function mark(roll, status) {
        // Save to data
        attendanceData[roll] = status;

        // Change background color of the row
        let row = document.getElementById("row-" + roll);
        if (status === 'Present') {
            row.className = 'row-present';
        } else {
            row.className = 'row-absent';
        }

        // Speak the action out loud
        speak(roll + " is " + status);
    }

    // 4. Generate the final list of absent students
    function showAbsent() {
        let absentRolls = [];
        
        // Loop through our data and find everyone marked 'Absent'
        for (let roll in attendanceData) {
            if (attendanceData[roll] === 'Absent') {
                absentRolls.push(roll);
            }
        }

        // Display logic
        const summaryBox = document.getElementById("summaryBox");
        const absentListText = document.getElementById("absentList");

        summaryBox.style.display = "block";

        if (absentRolls.length > 0) {
            let finalString = absentRolls.join(", ");
            absentListText.innerText = finalString;
            speak("Attendance complete. The following roll numbers are absent: " + finalString);
        } else {
            absentListText.innerText = "No one is absent!";
            speak("Attendance complete. No one is absent today.");
        }
    }
</script>

</body>
</html>
