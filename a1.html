<!DOCTYPE html>
<html>
<head>
    <title>CRUD with jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        table, th, td { border:1px solid black; border-collapse:collapse; padding:5px; }
        img { width:50px; height:50px; }
    </style>
</head>
<body>

<h2>Student CRUD Example</h2>

<!-- Form for Create/Update -->
First Name: <input type="text" id="fname">
Last Name: <input type="text" id="lname">
Age: <input type="number" id="age">
Semester: <input type="text" id="semester">
Roll No: <input type="text" id="roll">
Image Path: <input type="text" id="imgpath">
<button id="addBtn">Add</button>
<button id="updateBtn">Update</button>

<br><br>

<table id="studentTable">
    <thead>
        <tr>
            <th>FirstName</th><th>LastName</th><th>Age</th>
            <th>Semester</th><th>RollNumber</th><th>Image</th><th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
$(document).ready(function(){
    let students = [
        {FirstName:"Rahul", LastName:"Shah", Age:20, Semester:"2", RollNumber:"101", ImagePath:"https://via.placeholder.com/50"},
        {FirstName:"Priya", LastName:"Patel", Age:19, Semester:"1", RollNumber:"102", ImagePath:"https://via.placeholder.com/50"}
    ];
    let editIndex = -1;

    function display(){
        let tbody = $("#studentTable tbody");
        tbody.empty();
        $.each(students, function(i, s){
            tbody.append(`
                <tr>
                    <td>${s.FirstName}</td>
                    <td>${s.LastName}</td>
                    <td>${s.Age}</td>
                    <td>${s.Semester}</td>
                    <td>${s.RollNumber}</td>
                    <td><img src="${s.ImagePath}"></td>
                    <td>
                        <button class='editBtn' data-index='${i}'>Edit</button>
                        <button class='delBtn' data-index='${i}'>Delete</button>
                    </td>
                </tr>
            `);
        });
    }

    // CREATE
    $("#addBtn").click(function(){
        let s = {
            FirstName: $("#fname").val(),
            LastName: $("#lname").val(),
            Age: $("#age").val(),
            Semester: $("#semester").val(),
            RollNumber: $("#roll").val(),
            ImagePath: $("#imgpath").val()
        };
        students.push(s);
        display();
    });

    // READ (initial display)
    display();

    // UPDATE
    $(document).on("click",".editBtn",function(){
        editIndex = $(this).data("index");
        let s = students[editIndex];
        $("#fname").val(s.FirstName);
        $("#lname").val(s.LastName);
        $("#age").val(s.Age);
        $("#semester").val(s.Semester);
        $("#roll").val(s.RollNumber);
        $("#imgpath").val(s.ImagePath);
    });

    $("#updateBtn").click(function(){
        if(editIndex > -1){
            students[editIndex] = {
                FirstName: $("#fname").val(),
                LastName: $("#lname").val(),
                Age: $("#age").val(),
                Semester: $("#semester").val(),
                RollNumber: $("#roll").val(),
                ImagePath: $("#imgpath").val()
            };
            editIndex = -1;
            display();
        }
    });

    // DELETE
    $(document).on("click",".delBtn",function(){
        let i = $(this).data("index");
        students.splice(i,1);
        display();
    });
});
</script>

</body>
</html>
