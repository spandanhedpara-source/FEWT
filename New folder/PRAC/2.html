<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Spread with arrays
let arr1 = [1, 2, 3];
let arr2 = [...arr1, 4, 5];
console.log(arr2); // [1, 2, 3, 4, 5]

// Spread with objects
let obj1 = {a: 10, b: 20};
let obj2 = {...obj1, c: 30};
console.log(obj2); // {a: 10, b: 20, c: 30}

    </script>
</body>
</html>
